name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # GitHub keeps GITHUB_TOKEN read-only for ~10 min after push-triggered runs
  # (enhanced compatibility). Creating the release before that window closes
  # fails with 403 — wait it out once, then build.
  warmup:
    runs-on: ubuntu-22.04
    steps:
      - run: sleep 660
  build-and-release:
    needs: warmup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: bundle helpers (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/helpers | Out-Null
          # resolve the current official Windows build URL straight from exiftool.org
          $page = (Invoke-WebRequest -UseBasicParsing https://exiftool.org/).Content
          $url = [regex]::Match($page, 'https://sourceforge\.net/projects/exiftool/files/exiftool-[\d.]+_64\.zip/download').Value
          if (-not $url) { throw "exiftool download URL not found on exiftool.org" }
          Write-Host "exiftool source: $url"
          curl.exe -sL -o ex.zip $url
          Expand-Archive ex.zip -DestinationPath exdir
          $inner = Get-ChildItem exdir -Directory | Select-Object -First 1
          # the launcher requires exiftool_files/ as a sibling — flatten both into helpers/
          Get-ChildItem $inner.FullName -Filter *.exe | Select-Object -First 1 | Copy-Item -Destination src-tauri/helpers/exiftool.exe
          Copy-Item (Join-Path $inner.FullName "exiftool_files") src-tauri/helpers/exiftool_files -Recurse
          Remove-Item ex.zip, exdir -Recurse -Force
          curl.exe -sL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
          7z e -y ff.zip "ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -osrc-tauri/helpers/ | Out-Null
          Remove-Item ff.zip
          Get-ChildItem src-tauri/helpers | Select-Object Name, Length
          if (-not (Get-ChildItem src-tauri/helpers -Filter exiftool.exe)) { throw "exiftool.exe missing" }
          if (-not (Get-ChildItem src-tauri/helpers -Filter ffprobe.exe)) { throw "ffprobe.exe missing" }

      - name: build web assets
        run: |
          npm ci
          npm run build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kadr ${{ github.ref_name }}"
          releaseBody: |
            Kadr — локальний архіватор фото/відео.
            Завантажте збірку для своєї платформи:
                        - Windows: `.msi` або `-setup.exe` — ExifTool і FFprobe вже всередині, працює відразу після встановлення
                        - Linux: `.deb` (ExifTool і FFprobe до-install-юються автоматично), `.AppImage`, `.rpm`
                        - macOS: `.dmg` (потрібні ExifTool і FFprobe з Homebrew)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
