name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: build web assets
        run: |
          npm ci
          npm run build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kadr ${{ github.ref_name }}"
          releaseBody: |
            Kadr — локальний архіватор фото/відео.
            Завантажте інсталятор для своєї платформи:
            - Windows: `.msi` або `-setup.exe`
            - Linux: `.AppImage`, `.deb`, `.rpm`
            - macOS: `.dmg`
            Для повної роботи потрібні безплатні зовнішні інструменти: ExifTool та FFprobe.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
