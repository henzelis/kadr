name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: bundle helpers (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/helpers | Out-Null
          choco install exiftool -y --no-progress | Out-Null
          $ex = Get-ChildItem "$env:ProgramData\chocolatey\lib\exiftool\tools" -Filter *.exe | Select-Object -First 1
          Copy-Item $ex.FullName src-tauri/helpers/exiftool.exe
          curl.exe -sL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
          7z e -y ff.zip "ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -osrc-tauri/helpers/ | Out-Null
          Remove-Item ff.zip
          Get-ChildItem src-tauri/helpers
      - name: build web assets
        run: |
          npm ci
          npm run build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kadr ${{ github.ref_name }}"
          releaseBody: |
            Kadr — локальний архіватор фото/відео.
            Завантажте збірку для своєї платформи:
                        - Windows: `.msi` або `-setup.exe` — ExifTool і FFprobe вже всередині, працює відразу після встановлення
                        - Linux: `.deb` (ExifTool і FFprobe до-install-юються автоматично), `.AppImage`, `.rpm`
                        - macOS: `.dmg` (потрібні ExifTool і FFprobe з Homebrew)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
